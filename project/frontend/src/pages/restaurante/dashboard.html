<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>TSJ Foodies — Panel Restaurante</title>
 <link rel="stylesheet" href="../../styles/main.css" />
 <style>
 .estado-opt-btn {
 display: flex; align-items: center; gap: .75rem;
 width: 100%; padding: .7rem 1rem;
 background: var(--light); border: 1.5px solid var(--border);
 border-radius: 8px; font-size: .92rem; font-weight: 500;
 cursor: pointer; transition: all .15s; text-align: left;
 }
 .estado-opt-btn:hover { background: #f1f5f9; border-color: #94a3b8; }
 .estado-opt-btn.selected { background: var(--white); font-weight: 700; border-color: currentColor; box-shadow: 0 0 0 2px rgba(0,0,0,.08); }
 </style>
</head>
<body>

<nav class="navbar">
 <div class="navbar-brand">TSJ <span>FOODIES</span></div>
 <div class="navbar-nav" id="navbar-nav">
 <a class="nav-link active" href="dashboard.html">Inicio</a>
 <a class="nav-link" href="menu.html">Menú</a>
 <a class="nav-link" href="pagos.html">Pagos</a>
 <a class="nav-link" href="ventas.html">Ventas</a>
 </div>
 <div class="nav-user">
 <span><strong id="rest-name">...</strong></span>
 <button class="btn-logout" onclick="Auth.logout()">Salir</button>
 </div>
 <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú">
 <span></span><span></span><span></span>
 </button>
</nav>

<div class="container">
 <div class="dash-main-grid">

 <!-- Sidebar: pedidos entrantes -->
 <div>
 <div class="page-header">
 <h1>Pedidos entrantes
 <span id="pedidos-count"
 style="background:var(--danger);color:#fff;border-radius:50%;width:26px;height:26px;
 display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;margin-left:.4rem">0</span>
 </h1>
 </div>
 <div id="pedidos-list"><div class="spinner"></div></div>
 </div>

 <!-- Panel derecho: transacciones recientes -->
 <div>
 <div class="page-header">
 <h1>Transacciones recientes</h1>
 </div>

 <!-- Métodos de pago activos -->
 <div class="pay-info-grid">
 <div class="card">
 <div class="card-body">
 <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
 <h3 style="font-size:1rem">Todos los métodos de pago</h3>
 <input id="search-pedido" type="text" class="form-control"
 style="max-width:200px" placeholder="Buscar pedido #..." oninput="filtrarTransacciones()" />
 </div>
 <div class="table-wrap">
 <table id="transacciones-tabla">
 <thead><tr><th>Pedido</th><th>Usuario</th><th>Método</th><th>Monto</th><th>Estado</th></tr></thead>
 <tbody id="transacciones-body"><tr><td colspan="5"><div class="spinner" style="margin:.5rem auto;width:24px;height:24px;border-width:3px"></div></td></tr></tbody>
 </table>
 </div>
 </div>
 </div>

 <!-- Métodos activos + stats -->
 <div>
 <div class="card" style="margin-bottom:1rem">
 <div class="card-body">
 <h4 style="font-size:.9rem;margin-bottom:.8rem">Métodos de pago activos</h4>
 <div style="display:flex;align-items:center;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--border)">
 <div><div style="font-weight:600">Mercado Pago</div><div style="font-size:.78rem;color:var(--gray)">Checkout Pro online</div></div>
 <span style="background:var(--success);color:#fff;padding:.2rem .6rem;border-radius:20px;font-size:.78rem">Activo</span>
 </div>
 <div style="display:flex;align-items:center;justify-content:space-between;padding:.5rem 0">
 <div><div style="font-weight:600">Efectivo</div><div style="font-size:.78rem;color:var(--gray)">Pago en mostrador</div></div>
 <span style="background:var(--success);color:#fff;padding:.2rem .6rem;border-radius:20px;font-size:.78rem">Activo</span>
 </div>
 </div>
 </div>
 <div class="card">
 <div class="card-body">
 <h4 style="font-size:.9rem;margin-bottom:.8rem">Métodos usados hoy</h4>
 <div id="metodos-stats"></div>
 </div>
 </div>
 </div>
 </div>
 </div>
 </div>
</div>

<!-- Modal cambiar estado -->
<div id="estado-modal" class="modal-overlay hidden">
 <div class="modal" style="max-width:360px">
 <div class="modal-header">
 <h3>Actualizar Estado</h3>
 <button class="modal-close" onclick="closeEstadoModal()"></button>
 </div>
 <div class="modal-body">
 <p style="margin-bottom:1rem">Pedido <strong id="modal-pedido-id"></strong></p>
 <div class="form-group">
 <label class="form-label">Nuevo estado</label>
 <div style="display:flex;flex-direction:column;gap:.5rem;margin-top:.4rem">
 <button type="button" class="estado-opt-btn" data-val="en_preparacion" style="border-left:4px solid #3b82f6">
 <span style="width:10px;height:10px;border-radius:50%;background:#3b82f6;flex-shrink:0"></span>
 En preparación
 </button>
 <button type="button" class="estado-opt-btn" data-val="listo" style="border-left:4px solid #10b981">
 <span style="width:10px;height:10px;border-radius:50%;background:#10b981;flex-shrink:0"></span>
 Listo para entregar
 </button>
 <button type="button" class="estado-opt-btn" data-val="entregado" style="border-left:4px solid #6b7280">
 <span style="width:10px;height:10px;border-radius:50%;background:#6b7280;flex-shrink:0"></span>
 Entregado
 </button>
 <button type="button" class="estado-opt-btn" data-val="cancelado" style="border-left:4px solid #ef4444">
 <span style="width:10px;height:10px;border-radius:50%;background:#ef4444;flex-shrink:0"></span>
 Cancelado
 </button>
 </div>
 </div>
 </div>
 <div class="modal-footer">
 <button class="btn btn-secondary" onclick="closeEstadoModal()">Cancelar</button>
 <button class="btn btn-primary" onclick="guardarEstado()">Guardar</button>
 </div>
 </div>
</div>

<script src="../../services/api.js"></script>
<script>
 let pedidoEditId = null;
 let transaccionesData = [];

 const user = requireAuth('restaurante');
 if (user) {
 document.getElementById('rest-name').textContent = user.nombre.split(' ')[0];
 cargarTodo();
 // Auto-refresh cada 30s
 setInterval(cargarTodo, 30000);
 }

 async function cargarTodo() {
 try {
 const pedidos = await Pedidos.delRestaurante();
 transaccionesData = pedidos;
 renderPedidosActivos(pedidos);
 renderTransacciones(pedidos);
 calcularMetodos(pedidos);
 } catch(e) { console.error(e); }
 }

 function renderPedidosActivos(pedidos) {
 const activos = pedidos.filter(p => !['entregado','cancelado'].includes(p.estado));
 document.getElementById('pedidos-count').textContent = activos.length;
 const list = document.getElementById('pedidos-list');
 if (!activos.length) {
 list.innerHTML = `<div class="empty-state"><div class="icon"></div>
 <h3>Sin pedidos activos</h3><p>Los nuevos pedidos aparecerán aquí</p></div>`;
 return;
 }
 list.innerHTML = activos.map(p => `
 <div class="pedido-card pedido-estado-${p.estado}">
 <div class="pedido-card-header">
 <strong>#${p.id} — ${esc(p.cliente_nombre)}</strong>
 <span class="badge badge-${p.estado}">${estadoLabel(p.estado)}</span>
 </div>
 <ul class="pedido-items">
 ${p.items.map(i=>`<li>• ${esc(i.producto_nombre)} ×${i.cantidad}</li>`).join('')}
 </ul>
 <div class="pedido-total">$${parseFloat(p.total).toFixed(2)}</div>
 <div style="font-size:.78rem;color:var(--gray)">${new Date(p.created_at).toLocaleTimeString('es-MX')}</div>
 <div class="pedido-actions">
 <button class="btn btn-primary btn-sm" onclick="abrirEstadoModal(${p.id})"> Estado</button>
 </div>
 </div>`).join('');
 }

 const METODO_LABEL = { efectivo:'Efectivo', mercadopago:'Mercado Pago', tarjeta:'Tarjeta', paypal:'PayPal' };

 function renderTransacciones(pedidos) {
 const rows = pedidos.slice(0,50).map(p => `
 <tr>
 <td>#${p.id}</td>
 <td>${esc(p.cliente_nombre)}</td>
 <td>${METODO_LABEL[p.metodo_pago] || p.metodo_pago || '—'}</td>
 <td>$${parseFloat(p.total).toFixed(2)}</td>
 <td><span class="badge badge-${p.estado}">${estadoLabel(p.estado)}</span></td>
 </tr>`).join('');
 document.getElementById('transacciones-body').innerHTML =
 rows || '<tr><td colspan="5" style="text-align:center;color:var(--gray)">Sin transacciones</td></tr>';
 }

 function filtrarTransacciones() {
 const q = document.getElementById('search-pedido').value.toLowerCase();
 const filtrados = transaccionesData.filter(p =>
 String(p.id).includes(q) || p.cliente_nombre.toLowerCase().includes(q)
 );
 renderTransacciones(filtrados);
 }

 function calcularMetodos(pedidos) {
 const conPago = pedidos.filter(p => p.metodo_pago);
 const total = conPago.length || 1;
 const conteo = {};
 conPago.forEach(p => { conteo[p.metodo_pago] = (conteo[p.metodo_pago] || 0) + 1; });
 const stats = document.getElementById('metodos-stats');
 if (!conPago.length) {
 stats.innerHTML = '<p style="font-size:.82rem;color:var(--gray)">Sin pagos registrados</p>';
 return;
 }
 stats.innerHTML = Object.entries(conteo).map(([m, n]) => {
 const pct = Math.round((n/total)*100);
 return `<div style="margin-bottom:.6rem">
 <div style="display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:.2rem">
 <span>${METODO_LABEL[m] || m}</span>
 <span>${n} (${pct}%)</span>
 </div>
 <div style="background:var(--border);border-radius:20px;height:6px">
 <div style="width:${pct}%;background:var(--primary);height:6px;border-radius:20px"></div>
 </div>
 </div>`;
 }).join('');
 }

 function abrirEstadoModal(id) {
 pedidoEditId = id;
 document.getElementById('modal-pedido-id').textContent = `#${id}`;
 document.querySelectorAll('.estado-opt-btn').forEach(b => b.classList.remove('selected'));
 const defaultBtn = document.querySelector('.estado-opt-btn[data-val="en_preparacion"]');
 if (defaultBtn) defaultBtn.classList.add('selected');
 document.getElementById('estado-modal').classList.remove('hidden');
 }

 document.querySelectorAll('.estado-opt-btn').forEach(btn => {
 btn.addEventListener('click', () => {
 document.querySelectorAll('.estado-opt-btn').forEach(b => b.classList.remove('selected'));
 btn.classList.add('selected');
 });
 });

 function closeEstadoModal() {
 document.getElementById('estado-modal').classList.add('hidden');
 pedidoEditId = null;
 }

 async function guardarEstado() {
 const selectedBtn = document.querySelector('.estado-opt-btn.selected');
 if (!selectedBtn) { toast('Selecciona un estado', 'warning'); return; }
 const estado = selectedBtn.dataset.val;
 try {
 await Pedidos.updateEstado(pedidoEditId, estado);
 toast('Estado actualizado','success');
 closeEstadoModal();
 cargarTodo();
 } catch(e) { toast(e.message,'error'); }
 }

 function estadoLabel(e) {
 return { pendiente:'Pendiente', en_preparacion:'En preparación',
 listo:'Listo', entregado:'Entregado', cancelado:'Cancelado' }[e] || e;
 }
 function esc(s){ return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

 document.getElementById('nav-toggle').addEventListener('click', function(){
  document.getElementById('navbar-nav').classList.toggle('open');
 });
</script>
</body>
</html>
