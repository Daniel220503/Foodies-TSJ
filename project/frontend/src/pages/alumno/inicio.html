<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>TSJ Foodies — Inicio</title>
 <link rel="stylesheet" href="../../styles/main.css" />
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
 <div class="navbar-brand">TSJ <span>FOODIES</span></div>
 <div class="navbar-nav" id="navbar-nav">
 <a class="nav-link active" href="inicio.html">Inicio</a>
 <a class="nav-link" href="pedidos.html">Mis Pedidos</a>
 </div>
 <div class="nav-user">
 <span><strong id="user-name">...</strong></span>
 <button class="btn-logout" onclick="Auth.logout()">Salir</button>
 </div>
 <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú">
 <span></span><span></span><span></span>
 </button>
</nav>

<div class="container">
 <!-- Buscador -->
 <div class="search-bar">
 <span></span>
 <input id="search-input" type="text" placeholder="Buscar restaurante o platillo..." oninput="filtrarRestaurantes()" />
 </div>

 <div class="page-header">
 <h1>Restaurantes disponibles</h1>
 </div>

 <div id="restaurantes-grid" class="grid-3">
 <div class="spinner"></div>
 </div>
</div>

<!-- Modal: Menú del restaurante -->
<div id="menu-modal" class="modal-overlay hidden">
 <div class="modal" style="max-width:680px">
 <div class="modal-header">
 <button class="btn btn-secondary btn-sm" onclick="closeMenuModal()" style="margin-right:.75rem;display:flex;align-items:center;gap:.35rem">← Regresar</button>
 <h3 id="menu-modal-title" style="flex:1">Menú</h3>
 <button class="modal-close" onclick="closeMenuModal()"></button>
 </div>
 <div class="modal-body">
 <div class="tabs" id="categorias-tabs"></div>
 <div id="productos-grid" class="grid-2"></div>
 </div>
 </div>
</div>

<!-- Modal: Carrito -->
<div id="cart-modal" class="modal-overlay hidden">
 <div class="modal">
 <div class="modal-header">
 <h3> Mi Carrito</h3>
 <button class="modal-close" onclick="closeCartModal()"></button>
 </div>
 <div class="modal-body" id="cart-body"></div>
 <div class="modal-footer">
 <button class="btn btn-secondary" onclick="closeCartModal()">Seguir comprando</button>
 <button class="btn btn-primary" onclick="irACheckout()">Proceder al pago</button>
 </div>
 </div>
</div>

<!-- Modal: Checkout -->
<div id="checkout-modal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h3>Finalizar Pedido</h3>
      <button class="modal-close" onclick="closeCheckout()">✕</button>
    </div>
    <div class="modal-body">
      <div id="checkout-resumen" style="margin-bottom:1.2rem"></div>
      <div class="form-group">
        <label class="form-label">Notas (opcional)</label>
        <input id="notas-pedido" type="text" class="form-control" placeholder="Sin cebolla, extra salsa..." />
      </div>
      <!-- Botón principal: Mercado Pago Checkout Pro -->
      <div id="mp-wrapper" style="margin-bottom:.75rem">
        <button id="btn-mp" onclick="pagarConMP()"
          style="width:100%;padding:.85rem;border:none;border-radius:10px;cursor:pointer;
                 background:#009ee3;color:#fff;font-size:1rem;font-weight:700;
                 display:flex;align-items:center;justify-content:center;gap:.6rem">
          <svg width="22" height="22" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="16" fill="#fff"/>
            <path d="M8 16.5c0-4.142 3.582-7.5 8-7.5s8 3.358 8 7.5c0 1.38-.4 2.668-1.09 3.75H9.09A7.44 7.44 0 0 1 8 16.5Z" fill="#009ee3"/>
            <path d="M10.5 20.25h11l-1.5 2.25h-8l-1.5-2.25Z" fill="#009ee3"/>
          </svg>
          <span id="btn-mp-label">Pagar con Mercado Pago</span>
        </button>
        <p id="mp-unavail-msg" style="display:none;font-size:.78rem;color:#6b7280;text-align:center;margin-top:.4rem">
          No disponible en este entorno — usa el pago en efectivo
        </p>
      </div>
      <!-- Opción secundaria: efectivo -->
      <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.75rem">
        <hr style="flex:1;border:none;border-top:1px solid #e5e7eb"/>
        <span style="font-size:.8rem;color:#9ca3af">o</span>
        <hr style="flex:1;border:none;border-top:1px solid #e5e7eb"/>
      </div>
      <button id="btn-efectivo" onclick="confirmarPedidoEfectivo()"
        style="width:100%;padding:.7rem;border:1.5px solid #d1d5db;border-radius:10px;
               cursor:pointer;background:#fff;color:#374151;font-size:.92rem;font-weight:600">
        Pagar en efectivo en mostrador
      </button>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeCheckout()">Cancelar</button>
    </div>
  </div>
</div>

<!-- Modal: Comprobante -->
<div id="comprobante-modal" class="modal-overlay hidden">
 <div class="modal">
 <div class="modal-header">
 <h3>Comprobante de Pago</h3>
 <button class="modal-close" onclick="closeComprobante()"></button>
 </div>
 <div class="modal-body" id="comprobante-body"></div>
 <div class="modal-footer">
 <button class="btn btn-primary" onclick="closeComprobante()">Listo</button>
 </div>
 </div>
</div>

<!-- FAB Carrito -->
<button class="cart-fab" onclick="openCartModal()">
 
 <span class="cart-badge" id="cart-count">0</span>
</button>

<script src="../../services/api.js?v=2"></script>
<script>
 let restaurantesData = [];
 let menuActual = { categorias: [], productos: [], restaurante_id: null };

 // Guard
 const user = requireAuth('cliente');
 if (user) {
 document.getElementById('user-name').textContent = user.nombre.split(' ')[0];
 cargarRestaurantes();
 actualizarCartBadge();
 }

 async function cargarRestaurantes() {
 try {
 restaurantesData = await Restaurantes.getAll();
 renderRestaurantes(restaurantesData);
 } catch(e) {
 document.getElementById('restaurantes-grid').innerHTML =
 `<p style="color:var(--danger)">Error al cargar restaurantes: ${e.message}</p>`;
 }
 }

 function renderRestaurantes(lista) {
 const grid = document.getElementById('restaurantes-grid');
 if (!lista.length) {
 grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
 <div class="icon"></div><h3>No hay restaurantes disponibles</h3>
 <p>Pronto habrá más opciones</p></div>`;
 return;
 }
 grid.innerHTML = lista.map(r => `
 <div class="card" data-rest-id="${r.id}" style="cursor:pointer">
 <div class="card-img-placeholder"></div>
 <div class="card-body">
 <div class="card-title">${escHtml(r.nombre)}</div>
 <div class="card-desc">${escHtml(r.descripcion || 'Haz clic para ver el menú')}</div>
 <button class="btn btn-primary btn-sm">Ver Menú →</button>
 </div>
 </div>`).join('');
 document.querySelectorAll('[data-rest-id]').forEach(card => {
 card.addEventListener('click', () => {
 const r = restaurantesData.find(x => x.id === parseInt(card.dataset.restId));
 if (r) abrirMenu(r.id, r.nombre);
 });
 });
 }

 function filtrarRestaurantes() {
 const q = document.getElementById('search-input').value.toLowerCase();
 renderRestaurantes(restaurantesData.filter(r =>
 r.nombre.toLowerCase().includes(q) || (r.descripcion||'').toLowerCase().includes(q)
 ));
 }

 async function abrirMenu(id, nombre) {
 document.getElementById('menu-modal-title').textContent = ` ${nombre}`;
 document.getElementById('menu-modal').classList.remove('hidden');
 document.getElementById('productos-grid').innerHTML = '<div class="spinner"></div>';
 document.getElementById('categorias-tabs').innerHTML = '';
 try {
 const data = await Restaurantes.getMenu(id);
 menuActual = { ...data, restaurante_id: id };
 renderMenu(data);
 } catch(e) {
 document.getElementById('productos-grid').innerHTML = `<p style="color:var(--danger)">${e.message}</p>`;
 }
 }

 function renderMenu({ categorias, productos }) {
 // Tabs de categorías
 const tabs = document.getElementById('categorias-tabs');
 tabs.innerHTML = `<button class="tab-btn active" onclick="filtrarPorCategoria(null, this)">Todos</button>` +
 categorias.map(c =>
 `<button class="tab-btn" onclick="filtrarPorCategoria(${c.id}, this)">${escHtml(c.nombre)}</button>`
 ).join('');
 renderProductos(productos);
 }

 function filtrarPorCategoria(catId, btn) {
 document.querySelectorAll('#categorias-tabs .tab-btn').forEach(b => b.classList.remove('active'));
 btn.classList.add('active');
 const filtrados = catId ? menuActual.productos.filter(p => p.categoria_id === catId) : menuActual.productos;
 renderProductos(filtrados);
 }

 function renderProductos(productos) {
 const grid = document.getElementById('productos-grid');
 if (!productos.length) {
 grid.innerHTML = '<p style="color:var(--gray);padding:1rem">Sin productos en esta categoría</p>';
 return;
 }
 const carrito = Carrito.get();
 grid.innerHTML = productos.map(p => {
 const enCarrito = carrito.find(i => i.producto_id === p.id);
 const cantidad = enCarrito ? enCarrito.cantidad : 0;
 const pData = JSON.stringify(p).replace(/"/g,'&quot;');
 const controles = cantidad > 0
 ? `<div style="display:flex;align-items:center;gap:.5rem;margin-top:.7rem">
 <button class="btn btn-secondary btn-sm" style="width:2.2rem;padding:0;font-size:1.1rem"
 onclick="quitarDelCarrito(${p.id})">−</button>
 <span style="min-width:1.5rem;text-align:center;font-weight:700">${cantidad}</span>
 <button class="btn btn-primary btn-sm" style="width:2.2rem;padding:0;font-size:1.1rem"
 onclick="agregarAlCarrito(${pData})">+</button>
 </div>`
 : `<button class="btn btn-primary btn-sm btn-full" style="margin-top:.7rem"
 onclick="agregarAlCarrito(${pData})">+ Agregar</button>`;
 return `
 <div class="card">
 ${p.imagen_url
 ? `<img src="${escHtml(p.imagen_url)}" class="card-img" style="height:140px;object-fit:cover" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'card-img-placeholder'}))" />`
 : `<div class="card-img-placeholder" style="height:120px"></div>`}
 <div class="card-body">
 <div class="card-title">${escHtml(p.nombre)}</div>
 <div class="card-desc">${escHtml(p.descripcion || '')}</div>
 <div style="display:flex;align-items:center;justify-content:space-between;margin-top:.5rem">
 <span class="card-price">$${parseFloat(p.precio).toFixed(2)}</span>
 <span style="font-size:.8rem;color:var(--gray)"> ${p.tiempo_estimado} min</span>
 </div>
 ${controles}
 </div>
 </div>`;
 }).join('');
 }

 function agregarAlCarrito(producto) {
 const ok = Carrito.add(producto, menuActual.restaurante_id);
 if (ok) { actualizarCartBadge(); renderProductos(menuActual.productos); toast('Agregado','success'); }
 }

 function quitarDelCarrito(producto_id) {
 const items = Carrito.get();
 const item = items.find(i => i.producto_id === producto_id);
 if (!item) return;
 if (item.cantidad <= 1) Carrito.remove(producto_id);
 else Carrito.updateCantidad(producto_id, item.cantidad - 1);
 actualizarCartBadge();
 renderProductos(menuActual.productos);
 }

 function actualizarCartBadge() {
 document.getElementById('cart-count').textContent = Carrito.count();
 }

 function closeMenuModal() { document.getElementById('menu-modal').classList.add('hidden'); }

 function openCartModal() {
 const items = Carrito.get();
 const body = document.getElementById('cart-body');
 if (!items.length) {
 body.innerHTML = `<div class="empty-state"><div class="icon"></div><h3>Tu carrito está vacío</h3></div>`;
 } else {
 body.innerHTML = `
 <div class="table-wrap">
 <table>
 <thead><tr><th>Producto</th><th>Precio</th><th>Cant.</th><th></th></tr></thead>
 <tbody>
 ${items.map(i => `
 <tr>
 <td>${escHtml(i.nombre)}</td>
 <td>$${parseFloat(i.precio).toFixed(2)}</td>
 <td>
 <input type="number" min="1" max="20" value="${i.cantidad}"
 style="width:55px;padding:.3rem;border:1px solid var(--border);border-radius:6px"
 onchange="Carrito.updateCantidad(${i.producto_id},+this.value);actualizarCartBadge();openCartModal()"/>
 </td>
 <td><button class="btn btn-danger btn-sm"
 onclick="Carrito.remove(${i.producto_id});actualizarCartBadge();openCartModal()"></button></td>
 </tr>`).join('')}
 </tbody>
 </table>
 </div>
 <div style="text-align:right;margin-top:1rem;font-size:1.1rem;font-weight:700">
 Total: $${Carrito.total().toFixed(2)}
 </div>`;
 }
 document.getElementById('cart-modal').classList.remove('hidden');
 }

 function closeCartModal() { document.getElementById('cart-modal').classList.add('hidden'); }

 async function irACheckout() {
 const items = Carrito.get();
 if (!items.length) { toast('Tu carrito está vacío','warning'); return; }
 const resumen = `
 <h4 style="margin-bottom:.7rem">Resumen del pedido</h4>
 ${items.map(i => `<div class="comprobante-row">
 <span>${escHtml(i.nombre)} x${i.cantidad}</span>
 <span>$${(i.precio*i.cantidad).toFixed(2)}</span>
 </div>`).join('')}
 <div class="comprobante-row comprobante-total">
 <span>Total</span><span>$${Carrito.total().toFixed(2)}</span>
 </div>`;
 document.getElementById('checkout-resumen').innerHTML = resumen;
 closeCartModal();
 document.getElementById('checkout-modal').classList.remove('hidden');

 // Resetear estado del botón MP al abrir checkout
 const btnMp = document.getElementById('btn-mp');
 const msg   = document.getElementById('mp-unavail-msg');
 const label = document.getElementById('btn-mp-label');
 btnMp.disabled = false;
 btnMp.style.background = '#009ee3';
 btnMp.style.cursor = 'pointer';
 btnMp.style.opacity = '1';
 if (label) label.textContent = 'Pagar con Mercado Pago';
 msg.style.display = 'none';

 // Verificar disponibilidad de MP y ajustar botón
 try {
 const { disponible } = await fetch(API_URL + '/mp/status').then(r => r.json());
 if (!disponible) {
 btnMp.disabled = true;
 btnMp.style.background = '#9ca3af';
 btnMp.style.cursor = 'not-allowed';
 btnMp.style.opacity = '0.65';
 msg.style.display = 'block';
 }
 } catch(_) {}
 }

 function closeCheckout() { document.getElementById('checkout-modal').classList.add('hidden'); }

  // ── Pago con Mercado Pago Checkout Pro ──────────
  async function pagarConMP() {
    const btn = document.getElementById('btn-mp');
    if (btn.disabled) return;
    const items = Carrito.get();
    if (!items.length) return;
    const notas = document.getElementById('notas-pedido').value;
    const mpLabel = document.getElementById('btn-mp-label');
    btn.disabled = true;
    if (mpLabel) mpLabel.textContent = 'Creando orden...';
    try {
      const { checkout_url } = await MP.crearPreferencia({
        restaurante_id: items[0].restaurante_id,
        items: items.map(i => ({ producto_id: i.producto_id, cantidad: i.cantidad })),
        notas
      });
      Carrito.clear();
      actualizarCartBadge();
      window.location.href = checkout_url;
    } catch(e) {
      toast(e.message || 'No se pudo iniciar el pago. Intenta de nuevo.', 'error');
      if (!e.message.includes('no está disponible')) {
        btn.disabled = false;
        if (mpLabel) mpLabel.textContent = 'Pagar con Mercado Pago';
      }
    }
  }

  // ── Pago en efectivo (flujo simple) ─────────────
  async function confirmarPedidoEfectivo() {
    const items = Carrito.get();
    if (!items.length) return;
    const notas = document.getElementById('notas-pedido').value;
    const btn   = document.getElementById('btn-efectivo');
    btn.disabled = true; btn.textContent = '⏳ Procesando...';
    try {
      const { pedido_id } = await Pedidos.create({
        restaurante_id: items[0].restaurante_id,
        items: items.map(i => ({ producto_id: i.producto_id, cantidad: i.cantidad })),
        notas
      });
      const { comprobante } = await Pagos.procesar({ pedido_id, metodo: 'efectivo' });
      Carrito.clear();
      actualizarCartBadge();
      closeCheckout();
      mostrarComprobante(comprobante);
    } catch(e) {
      toast(e.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Pagar en efectivo en mostrador';
    }
  }

 function mostrarComprobante(c) {
 document.getElementById('comprobante-body').innerHTML = `
 <div class="comprobante">
 <div class="comprobante-header">
 <div style="font-size:2rem"></div>
 <div class="comprobante-folio">${c.folio}</div>
 <div style="font-size:.85rem;color:var(--gray)">${new Date(c.fecha).toLocaleString('es-MX')}</div>
 </div>
 <div class="comprobante-row"><span>Cliente</span><span>${escHtml(c.usuario.nombre)}</span></div>
 <div class="comprobante-row"><span>Restaurante</span><span>${escHtml(c.restaurante)}</span></div>
 <div class="comprobante-row"><span>Método de pago</span><span>${c.metodo_pago}</span></div>
 <div style="margin-top:.8rem;margin-bottom:.3rem;font-weight:600;font-size:.85rem;color:var(--gray)">PRODUCTOS</div>
 ${c.items.map(i => `
 <div class="comprobante-row">
 <span>${escHtml(i.nombre)} x${i.cantidad}</span>
 <span>$${parseFloat(i.subtotal).toFixed(2)}</span>
 </div>`).join('')}
 <div class="comprobante-row comprobante-total">
 <span>TOTAL</span><span>$${parseFloat(c.total).toFixed(2)}</span>
 </div>
 </div>`;
 document.getElementById('comprobante-modal').classList.remove('hidden');
 toast('¡Pedido realizado exitosamente!','success');
 }

 function closeComprobante() { document.getElementById('comprobante-modal').classList.add('hidden'); }

 function escHtml(s) {
 return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 }
 document.getElementById('nav-toggle').addEventListener('click', function(){
  document.getElementById('navbar-nav').classList.toggle('open');
 });
</script>

<!-- ── Asistente Gemini ───────────────────────── -->
<style>
 #chat-fab{position:fixed;bottom:1.5rem;left:1.5rem;width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:1.4rem;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:200;transition:transform .2s}
 #chat-fab:hover{transform:scale(1.08)}
 #chat-panel{position:fixed;bottom:5rem;left:1.5rem;width:320px;max-height:460px;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;z-index:200;overflow:hidden;transition:opacity .2s,transform .2s}
 #chat-panel.hidden{opacity:0;pointer-events:none;transform:translateY(12px)}
 .chat-header{background:var(--primary);color:#fff;padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between}
 .chat-header-info{display:flex;flex-direction:column}
 .chat-header-title{font-weight:700;font-size:.95rem}
 .chat-header-sub{font-size:.72rem;opacity:.85}
 #chat-close{background:none;border:none;color:#fff;font-size:1.1rem;cursor:pointer;line-height:1}
 #chat-messages{flex:1;overflow-y:auto;padding:.75rem;display:flex;flex-direction:column;gap:.5rem;min-height:200px}
 .msg{max-width:88%;padding:.5rem .75rem;border-radius:12px;font-size:.84rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
 .msg-bot{background:#f3f4f6;align-self:flex-start;border-bottom-left-radius:4px}
 .msg-user{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
 .msg-typing{background:#f3f4f6;align-self:flex-start;border-radius:12px;border-bottom-left-radius:4px;padding:.5rem .9rem;font-size:1.2rem;letter-spacing:.1rem}
 #chat-input-row{display:flex;gap:.5rem;padding:.6rem .75rem;border-top:1px solid var(--border)}
 #chat-input{flex:1;border:1px solid var(--border);border-radius:8px;padding:.4rem .7rem;font-size:.85rem;outline:none;resize:none}
 #chat-input:focus{border-color:var(--primary)}
 #chat-send{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:.4rem .85rem;font-size:.84rem;font-weight:600;cursor:pointer;transition:opacity .2s}
 #chat-send:disabled{opacity:.5;cursor:not-allowed}
</style>

<button id="chat-fab" onclick="toggleChat()" title="Asistente TSJ Foodies">
 <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-3 3v-3z"/></svg>
</button>

<div id="chat-panel" class="hidden">
 <div class="chat-header">
  <div class="chat-header-info">
   <span class="chat-header-title">Asistente TSJ Foodies</span>
   <span class="chat-header-sub">Pregunta sobre platillos, precios y más</span>
  </div>
  <button id="chat-close" onclick="toggleChat()">✕</button>
 </div>
 <div id="chat-messages"></div>
 <div id="chat-input-row">
  <input id="chat-input" type="text" placeholder="Escribe tu pregunta..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();enviarMensaje()}" />
  <button id="chat-send" onclick="enviarMensaje()">Enviar</button>
 </div>
</div>

<script>
(function(){
  // historial guarda la conversación en el formato que entiende Gemini:
  // [{role:'user', parts:[{text:'...'}]}, {role:'model', parts:[{text:'...'}]}, ...]
  // Se lo mandamos al backend en cada mensaje para que Gemini recuerde el contexto
  const historial = [];

  function toggleChat(){
    const panel = document.getElementById('chat-panel');
    const abriendo = panel.classList.toggle('hidden');
    // Si es la primera vez que se abre, mostramos el saludo
    if(!abriendo && document.getElementById('chat-messages').children.length === 0){
      agregarMensaje('¡Hola! Soy el asistente de TSJ Foodies. Puedo ayudarte con el menú, precios, tiempos y recomendaciones. ¿Qué deseas saber?', 'bot');
    }
  }

  function agregarMensaje(texto, quien){
    const msgs = document.getElementById('chat-messages');
    const d = document.createElement('div');
    d.className = 'msg msg-' + quien;
    d.textContent = texto;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  function mostrarTyping(){
    const msgs = document.getElementById('chat-messages');
    const d = document.createElement('div');
    d.className = 'msg-typing';
    d.id = 'chat-typing';
    d.textContent = '···';
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function quitarTyping(){
    const t = document.getElementById('chat-typing');
    if(t) t.remove();
  }

  window.enviarMensaje = async function(){
    const input = document.getElementById('chat-input');
    const btn   = document.getElementById('chat-send');
    const texto = input.value.trim();
    if(!texto) return;

    agregarMensaje(texto, 'user');
    input.value = '';
    input.disabled = true;
    btn.disabled   = true;
    mostrarTyping();

    try {
      // Llamamos al backend con el mensaje y el historial completo de la conversación
      const res = await fetch(`${API_URL}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensaje: texto, historial })
      });

      const data = await res.json();
      quitarTyping();

      if(!res.ok){
        agregarMensaje('Ocurrió un error. Intenta de nuevo.', 'bot');
        return;
      }

      agregarMensaje(data.respuesta, 'bot');

      // Guardamos el intercambio en el historial para que Gemini
      // recuerde lo que se dijo en los siguientes mensajes
      historial.push({ role: 'user',  parts: [{ text: texto }] });
      historial.push({ role: 'model', parts: [{ text: data.respuesta }] });

    } catch(e){
      quitarTyping();
      agregarMensaje('No pude conectarme. Verifica tu conexión.', 'bot');
    } finally {
      input.disabled = false;
      btn.disabled   = false;
      input.focus();
    }
  };

  window.toggleChat = toggleChat;
})();
</script>
</body>
</html>
