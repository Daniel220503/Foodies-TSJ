 version: "3.9"

 services:

  postgres:
    image: postgres:17
    container_name: tsj_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: tsj_foodies
    ports:
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tsj_foodies"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    container_name: foodies_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://postgres:123456@postgres:5432/tsj_foodies
      JWT_SECRET: tsj_foodies_secret_2024
      PORT: 5000
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: foodies_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

 volumes:
  postgres_data: